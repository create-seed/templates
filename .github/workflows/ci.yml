name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *' # 4:20 AM ICT (UTC+7)

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Environment
        uses: ./.github/actions/setup
      - name: Validate registry (create-seed@${{ vars.CREATE_SEED_TAG || 'latest' }})
        run: |
          TAG="${{ vars.CREATE_SEED_TAG || 'latest' }}"
          echo "Using create-seed@${TAG}"
          bun x create-seed@${TAG} registry validate --fail-on-warning

  setup-templates:
    name: Discover templates
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.matrix.outputs.templates }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: ref
        run: |
          # For PRs use the head ref, otherwise use the branch name
          REF="${{ github.head_ref || github.ref_name }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Ref: $REF"
      - id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t ALL_TEMPLATE_PATHS < <(jq -r '.templates[].path' templates.json)
          ALL_TEMPLATES=$(printf '%s\n' "${ALL_TEMPLATE_PATHS[@]}" | jq -Rsc 'split("\n")[:-1]')

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            TEMPLATES="$ALL_TEMPLATES"
            echo "Running full matrix for event: ${{ github.event_name }}"
          else
            mapfile -t CHANGED_FILES < <(
              gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename'
            )

            if [ "${#CHANGED_FILES[@]}" -eq 0 ]; then
              TEMPLATES="$ALL_TEMPLATES"
              echo "No changed files found for PR; running full matrix."
            else
              RUN_ALL=false
              declare -A SELECTED_TEMPLATES=()

              for file in "${CHANGED_FILES[@]}"; do
                MATCHED=false

                for template in "${ALL_TEMPLATE_PATHS[@]}"; do
                  if [[ "$file" == "$template/"* ]]; then
                    SELECTED_TEMPLATES["$template"]=1
                    MATCHED=true
                    break
                  fi
                done

                if [ "$MATCHED" = false ]; then
                  RUN_ALL=true
                  echo "Shared change detected: $file"
                  break
                fi
              done

              if [ "$RUN_ALL" = true ]; then
                TEMPLATES="$ALL_TEMPLATES"
              else
                TEMPLATES=$(
                  for template in "${ALL_TEMPLATE_PATHS[@]}"; do
                    if [[ -n "${SELECTED_TEMPLATES[$template]:-}" ]]; then
                      printf '%s\n' "$template"
                    fi
                  done | jq -Rsc 'split("\n")[:-1]'
                )
                echo "Running changed templates only."
              fi
            fi
          fi

          echo "templates=$TEMPLATES" >> "$GITHUB_OUTPUT"
          echo "Templates: $TEMPLATES"

  test:
    name: "${{ matrix.template }} · node ${{ matrix.node }} · ${{ matrix.pm }}"
    runs-on: ubuntu-latest
    needs: [validate, setup-templates]
    if: needs.setup-templates.outputs.templates != '[]'
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.setup-templates.outputs.templates) }}
        node: [22, 24]
        pm: [bun, npx, pnpx]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Quasar
        if: contains(fromJson('["quasar-react-counter","quasar-react-escrow"]'), matrix.template)
        uses: beeman/setup-quasar@4f4895f951ce7ea257d9f5170d5119e4b136fa82 # v1.0.0

      - name: Install pnpm
        if: matrix.pm == 'pnpx'
        run: npm install -g pnpm

      - name: Scaffold project (create-seed@${{ vars.CREATE_SEED_TAG || 'latest' }})
        run: |
          REPO="${{ github.event.pull_request.head.repo.full_name || github.repository }}"
          REF="${{ needs.setup-templates.outputs.ref }}"
          TEMPLATE="gh:${REPO}/${{ matrix.template }}#${REF}"
          echo "Template: $TEMPLATE"

          TAG="${{ vars.CREATE_SEED_TAG || 'latest' }}"
          echo "Using create-seed@${TAG}"
          case "${{ matrix.pm }}" in
            bun)  CMD="bun x create-seed@${TAG}" ;;
            npx)  CMD="npx -y create-seed@${TAG}" ;;
            pnpx) CMD="pnpx create-seed@${TAG}" ;;
          esac
          $CMD test-project -t "$TEMPLATE"
        working-directory: ${{ runner.temp }}

      - name: CI
        run: bun run ci
        working-directory: ${{ runner.temp }}/test-project

      - name: Verify clean git
        run: |
          STATUS=$(git status --porcelain)
          if [ -n "$STATUS" ]; then
            echo "::error::Git is dirty after install + build:"
            echo "$STATUS"
            exit 1
          fi
        working-directory: ${{ runner.temp }}/test-project
